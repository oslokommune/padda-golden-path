name: CI
on:
  pull_request:
    branches: ["main"]
jobs:
  generate_dir_matrices:
    runs-on: ubuntu-latest
    outputs:
      pythonlibs: ${{ steps.list-libs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: list-libs
        run: |
          # Generate a JSON array of directory names (e.g., '["dir1", "dir2"]')
          DIRS=$(find ./libs ./examples -mindepth 1 -maxdepth 1 | jq -R . | jq -s . | jq -c .)
          echo "dirs=$DIRS" >> $GITHUB_OUTPUT
  validate_python_code:
    needs: generate_dir_matrices
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.generate_dir_matrices.outputs.pythonlibs) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format ${{matrix.directory}}
        run: uv format --check
        working-directory: ${{ matrix.directory }}
      - name: Sync ${{matrix.directory}}
        run: uv sync
        working-directory: ${{ matrix.directory }}
      - name: Typecheck ${{matrix.directory}}
        run: uvx ty check .
        working-directory: ${{ matrix.directory }}
      - name: Lint ${{matrix.directory}}
        run: uvx ruff check .
        working-directory: ${{ matrix.directory }}
