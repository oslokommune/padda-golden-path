AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model template describing your function.
Resources:
  paddatestpulllambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Description: ""
      MemorySize: 128
      Timeout: 300
      Handler: pull.lambda_handler
      Runtime: python3.14
      Architectures:
        - arm64
      EphemeralStorage:
        Size: 512
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
        DestinationConfig: {}
      PackageType: Zip
      Policies:
        - Statement:
            - Condition:
                StringLike:
                  s3:prefix: tmp_test_removeme/green/*
              Action:
                - s3:ListBucket
              Resource: arn:aws:s3:::69d82-padda-landing-zone
              Effect: Allow
            - Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource: arn:aws:s3:::69d82-padda-landing-zone/tmp_test_removeme/green/*
              Effect: Allow
            - Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
              Effect: Allow
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: "*"
      RecursiveLoop: Terminate
      SnapStart:
        ApplyOn: None
      Tags:
        CreatedBy: ok-golden-path
        Environment: padda-dev
        Team: Dataspeilet
        lambda:createdBy: SAM
      Events:
        Schedule1:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
