# Job definition for the VS Code demo, mirroring the sample_job structure.
resources:
  jobs:
    vscode_demo_job:
      name: vscode_demo_job

      tasks:
        - task_key: run_vscode_demo
          job_cluster_key: job_cluster
          python_wheel_task:
            package_name: vscode_demo
            entry_point: main
          libraries:
            - whl: ../dist/*.whl

      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: i3.xlarge
            data_security_mode: SINGLE_USER
            custom_tags:
              CostTeam: padda
              CostProcess: Transform
            autoscale:
              min_workers: 1
              max_workers: 2
