name: Collect Databricks Metrics

# Weekly workspace inventory snapshot — counts jobs, DLT pipelines, and
# tables per medallion layer across all workspaces in the dev (and
# optionally prod) Databricks accounts. Uploads JSONL to a Unity Catalog
# volume; the platform_metrics DLT pipeline (in padda-databrikker) reads
# from there via Auto Loader.
#
# Auth: Databricks M2M client_credentials. OIDC federation is wired in
# padda-iac but the exchange currently returns TOKEN_INVALID — to be
# revisited.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABRICKS_HOST: "https://dbc-00000000-0001.cloud.databricks.com"
  VOLUME_PATH: "/Volumes/padda_dev_green/landing_default/platform_events/metrics"
  DEV_CLIENT_ID: "00000000-0000-0000-0000-000000000003"

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install urllib3

      - name: Collect metrics
        env:
          DEV_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          PROD_CLIENT_ID: ${{ secrets.PROD_CLIENT_ID }}
          PROD_CLIENT_SECRET: ${{ secrets.PROD_CLIENT_SECRET }}
        run: python .github/scripts/collect_platform_metrics.py
