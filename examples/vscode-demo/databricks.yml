# Databricks asset bundle definition for vscode-demo.
bundle:
  name: vscode-demo
  uuid: 4d8b9b7c-7fef-42a3-943b-414606cf0f02

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dev-workspace.cloud.databricks.com # Change to your workspace URL
    presets:
      artifacts_dynamic_version: true

  prod:
    mode: production
    workspace:
      host: https://prod-workspace.cloud.databricks.com # Change to your workspace URL
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: my-deploy-sp # Change to your service principal
    permissions:
      - service_principal_name: my-deploy-sp
        level: CAN_MANAGE
