name: Collect Databricks Metrics

# Weekly workspace inventory snapshot — counts jobs, DLT pipelines, and tables
# per medallion layer across the workspaces in one Databricks account, uploaded
# as JSONL to that environment's Unity Catalog landing volume. The
# platform_metrics DLT pipeline (in padda-databrikker) reads it via Auto Loader.
#
# Runs once per GitHub environment (dev, prod) via the matrix below. Each
# environment supplies its own config; only the catalog varies the upload path
# (the collector derives landing_default/platform_events/workspace_inventory).
#   vars:    DATABRICKS_ACCOUNT_ID, DATABRICKS_CLIENT_ID, DATABRICKS_HOST,
#            DATABRICKS_METRICS_CATALOG
#   secrets: DATABRICKS_CLIENT_SECRET
#
# Auth: Databricks M2M client_credentials.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    environment:
      name: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install urllib3

      - name: Collect metrics
        env:
          DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_METRICS_CATALOG: ${{ vars.DATABRICKS_METRICS_CATALOG }}
          ACCOUNT_LABEL: ${{ matrix.environment }}
        run: python .github/scripts/collect_platform_metrics.py
