# ============================================================================
# Docs Review — Automatisk Diataxis-gjennomgang av dokumentasjonsendringer
# ============================================================================
#
# HVA GJØR DENNE WORKFLOWEN?
#   Når noen åpner eller oppdaterer en PR som endrer markdown-filer i docs/,
#   kjører Claude Code en Diataxis-review. Claude sjekker at dokumentasjonen
#   følger riktig type (tutorial, how-to, explanation, reference) og gir
#   konkret tilbakemelding som PR-kommentarer — både inline og som oppsummering.
#
# AUTENTISERING:
#   AWS Bedrock via OIDC (OpenID Connect).
#   GitHub Actions beviser sin identitet til AWS uten statiske nøkler.
#   Krever en IAM-rolle med Bedrock-tilgang — se AWS-steget for detaljer.
#
# KOSTNAD:
#   Bruker Claude Sonnet som er rask og rimelig. Typisk PR-review bruker
#   ~10-50k tokens avhengig av diff-størrelse. Bytt til "opus" i claude_args
#   for grundigere (men dyrere) analyse.
# ============================================================================

name: Docs Review (Diataxis)

# ── Trigger ──────────────────────────────────────────────────────────────────
#
# "on" definerer NÅR workflowen kjører.
#
# pull_request:
#   GitHub-hendelse som fyres av når noen oppretter eller oppdaterer en PR.
#
# types:
#   - opened:      Når en ny PR opprettes
#   - synchronize: Når nye commits pushes til PR-branchen
#   (Det finnes flere typer som "reopened", "ready_for_review" osv.
#    Vi trenger bare disse to for å fange opp nye og oppdaterte PRs.)
#
# paths:
#   Filfilter — workflowen kjører BARE når filer som matcher mønsteret endres.
#   'docs/**/*.md' betyr "alle .md-filer i docs/ og undermapper".
#   Hvis en PR bare endrer Python-filer, kjører IKKE denne workflowen.
#
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "docs/**/*.md"

# ── Tilganger ────────────────────────────────────────────────────────────────
#
# Hver workflow får et automatisk GITHUB_TOKEN med begrensede tilganger.
# Her definerer vi hva tokenet skal ha lov til:
#
# contents: read      — Lese filer i repoet (Claude trenger dette for å lese docs)
# pull-requests: write — Poste kommentarer på PR-en
# id-token: write     — For OIDC-autentisering (Bedrock). Ufarlig å ha med
#                        selv om du bruker API-nøkkel — den gjør ingenting
#                        med mindre en OIDC-provider faktisk bruker den.
#
permissions:
  contents: read
  pull-requests: write
  id-token: write

# ── Concurrency ──────────────────────────────────────────────────────────────
#
# Hindrer at flere reviews kjører parallelt for samme PR.
#
# Scenario: Du pusher commit A. Review starter. Du pusher commit B 2 min
# senere. Uten concurrency ville begge reviews fullført og postet doble
# kommentarer. Med concurrency:
#   - group: Unik nøkkel per PR (basert på PR-nummeret)
#   - cancel-in-progress: true — kansellerer review av commit A når commit B
#     trigger en ny kjøring
#
# Resultat: Bare siste push får en review-kommentar.
#
concurrency:
  group: docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ── Jobs ─────────────────────────────────────────────────────────────────────
#
# En workflow har én eller flere "jobs". Hver job kjører på en egen
# virtuell maskin (runner). Jobs kjører parallelt med mindre du setter
# avhengigheter med "needs".
#
# Vi trenger bare én job her: selve reviewen.
#
jobs:
  review:
    # "if" er en betingelse — jobben hopper over hvis den er false.
    # Her sjekker vi at PR-en IKKE er et draft. Ingen vits i å reviewe
    # uferdige PRs.
    if: github.event.pull_request.draft == false

    # GitHub Environment: gir tilgang til miljøspesifikke secrets og
    # eventuelle deployment-regler (f.eks. godkjenning før kjøring).
    # AWS_ROLE_ARN må ligge som secret i dette environmentet.
    environment: claude-test

    # Hvilken type maskin jobben kjører på. ubuntu-latest er standard
    # og billigst for GitHub-hosted runners.
    runs-on: ubuntu-latest

    steps:
      # ── Steg 1: Sjekk ut koden ────────────────────────────────────────
      #
      # "uses" kjører en ferdig action fra GitHub Marketplace.
      # actions/checkout kloner repoet inn på runner-maskinen.
      #
      # fetch-depth: 0 henter FULL git-historikk. Standard er 1 (bare
      # siste commit), men Claude trenger mer for å se diffen mot base.
      #
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Steg 2: Hent AWS-credentials via OIDC ──────────────────────────
      #
      # OIDC (OpenID Connect) lar GitHub Actions autentisere mot AWS uten
      # å lagre statiske nøkler. Flyten er:
      #
      #   1. GitHub Actions genererer et JWT-token som sier
      #      "Jeg er workflow X i repo Y"
      #   2. AWS verifiserer tokenet mot GitHubs OIDC-provider
      #   3. AWS gir tilbake midlertidige credentials (gyldig ~1 time)
      #
      # For at dette skal funke trenger du:
      #   a) En IAM OIDC Identity Provider for GitHub i AWS-kontoen
      #      (kan allerede finnes — sjekk IAM → Identity providers)
      #   b) En IAM-rolle som:
      #      - Stoler på GitHubs OIDC-provider
      #      - Har policy for Bedrock (se under)
      #      - Har condition som begrenser til dette repoet
      #   c) Rolle-ARN lagret som GitHub secret: AWS_ROLE_TO_ASSUME
      #
      # role-to-assume: ARN-en til IAM-rollen, f.eks.
      #   arn:aws:iam::123456789012:role/github-actions-claude-bedrock
      #
      # aws-region: Hvilken AWS-region Bedrock-modellene kjører i.
      #   Sjekk at Claude er tilgjengelig i regionen dere velger.
      #   eu-west-1 (Irland) og us-east-1 (Virginia) er vanlige.
      #
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      # ── Steg 2: Kjør Claude Code ──────────────────────────────────────
      #
      # anthropics/claude-code-action kjører Claude Code i CI.
      #
      # Når "prompt" er satt, kjører den i "automation mode": Claude starter
      # umiddelbart med oppgaven. Uten prompt ville den ventet på en
      # @claude-mention i en PR-kommentar ("interactive mode").
      #
      # Claude har tilgang til hele repoet (checkout-steget over) og kan
      # bruke verktøyene vi spesifiserer i --allowedTools.
      #
      # CLAUDE.md i repoet lastes automatisk som ekstra kontekst.
      #
      - name: Diataxis review
        uses: anthropics/claude-code-action@v1
        with:
          # ── Autentisering ──
          # use_bedrock forteller claude-code-action at den skal bruke
          # AWS Bedrock i stedet for direkte Anthropic API. Credentials
          # er allerede satt opp av OIDC-steget over — de ligger i
          # miljøvariabler som AWS SDK-en plukker opp automatisk.
          use_bedrock: "true"

          # ── Fremdriftsvisning ──
          # Poster en kommentar med sjekkbokser som oppdateres mens
          # Claude jobber, så du kan se at noe skjer.
          track_progress: true

          # ── Claude CLI-argumenter ──
          #
          # --model: Med Bedrock bruker du det fulle modell-ID-et.
          #   Sonnet er rask og rimelig. For grundigere analyse, bytt til
          #   Opus-varianten (tar lengre tid, koster mer).
          #
          # --allowedTools "..."
          #   Verktøy Claude har lov til å bruke. Sikkerhetsprinsipp:
          #   gi bare tilgang til det som trengs.
          #
          #   Read        — Lese filer i repoet
          #   Glob        — Finne filer etter mønster (f.eks. docs/**/*.md)
          #   Grep        — Søke i filinnhold
          #   Bash(gh pr comment:*)  — Poste kommentarer på PR-en
          #   Bash(gh pr diff:*)     — Hente PR-diffen
          #   Bash(gh pr view:*)     — Se PR-metadata (tittel, beskrivelse, etc.)
          #   mcp__github_inline_comment__create_inline_comment
          #                          — Poste kommentarer på spesifikke linjer i diffen
          #
          claude_args: |
            --model anthropic.claude-sonnet-4-6-20250514-v1:0
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"

          # ── Prompt ──
          #
          # Selve oppdraget til Claude. Fordi "prompt" er satt, kjører
          # workflowen i automation mode.
          #
          # Legg merke til steg 1: Claude leser først Diataxis-referansefilene
          # fra .github/diataxis-references/ for å ha det fulle rammeverket
          # tilgjengelig. Dette er det samme mønsteret som den lokale
          # Diataxis-skillen bruker ("lazy load" riktig referansefil).
          #
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Du skal gjennomgå dokumentasjonsendringene i denne PR-en
            i henhold til Diataxis-rammeverket.

            ## Steg 1 — Last Diataxis-referanser

            VIKTIG: Før du starter reviewen, les følgende referansefiler
            som ligger i repoet:

            1. Les `.github/diataxis-references/diataxis-summary.md` for
               en oversikt over rammeverket og kompasset
            2. Kjør `gh pr diff ${{ github.event.pull_request.number }}`
               for å se hvilke docs-filer som er endret
            3. For hver endret fil, sjekk `diataxis`-feltet i frontmatter
               og les den TILHØRENDE referansefilen:
               - diataxis: tutorial  → les `.github/diataxis-references/tutorials.md`
               - diataxis: how-to    → les `.github/diataxis-references/how-to-guides.md`
               - diataxis: reference → les `.github/diataxis-references/reference.md`
               - diataxis: explanation → les `.github/diataxis-references/explanation.md`

            Du trenger bare lese referansefilene for de typene som faktisk
            forekommer i PR-en.

            ## Steg 2 — Gjennomgå endringene

            Les de endrede/nye markdown-filene i docs/. For hver fil, vurder:

            a. Er `diataxis`-frontmatter satt? Er typen korrekt for innholdet?
            b. Følger innholdet prinsippene for sin deklarerte type?
               (Bruk sjekklisten i referansefilen du nettopp leste.)
            c. Blandes typer uheldig? Typiske feil:
               - Tutorial-steg i en how-to (steg-for-steg med "vi"-form)
               - Forklaringer/teori i en how-to (bør lenke til explanation)
               - Instruksjoner i en reference (bør lenke til how-to)
               - Komponentlister i en explanation (bør være reference)
            d. Er frontmatter komplett (title, description, diataxis)?

            ## Steg 3 — Post funn

            - Bruk `mcp__github_inline_comment__create_inline_comment`
              (med `confirmed: true`) for spesifikke problemer på bestemte
              linjer i diffen
            - Post EN oppsummerende kommentar med `gh pr comment` som inneholder:
              - En kort vurdering per endret fil
              - Overordnet inntrykk
              - Eventuelle forslag til forbedring

            ## Retningslinjer

            - Vær konstruktiv og spesifikk — henvis til konkrete prinsipper
              fra Diataxis-referansene
            - Fokuser på strukturelle/type-problemer, ikke små stilnyanser
            - Ikke kommenter på innholdsvalg — bare på om Diataxis-reglene følges
            - Hvis alt ser bra ut, si det kort og positivt
            - Skriv alle kommentarer på norsk
