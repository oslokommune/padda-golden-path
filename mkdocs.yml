copyright: 'Made with ❤️ by Oslo Origo

  '
docs_dir: ./docs
edit_uri: https://github.com/oslokommune/padda-golden-path/tree/main/docs
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/oslokommune
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/company/osloorigo
  - icon: fontawesome/solid/flask
    link: https://labs.oslo.kommune.no/
extra_css:
- stylesheets/admonitions.css
- stylesheets/extra.css
- stylesheets/punkt.css
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - class: mermaid
      format: !!python/name:mermaid2.fence.fence_mermaid_custom ''
      name: mermaid
- pymdownx.keys
- attr_list
nav:
- Home: index.md
- Arkitektur:
  - Oversikt: architecture/dataflyt_sye.md
- Implementering: architecture/progresjon.md
- Golden Paths:
  - Databricks Bundles:
    - Oversikt: golden-paths/databricks-bundles.md
    - API Ingestion Example - Databricks Asset Bundle: golden-paths/databricks-bundles/api_ingest.md
    - Ingest Excel - Databricks Asset Bundle: golden-paths/databricks-bundles/excel_ingest.md
  - Generic Pipelines: golden-paths/generic-pipelines.md
- Guides:
  - Guider: guides/index.md
  - Data:
    - Ingest Api: guides/data/ingest-api.md
    - Landing Zone: guides/data/landing-zone.md
    - Laste Opp Excel Til Uc: guides/data/laste-opp-excel-til-uc.md
  - Developer:
    - Dev Setup: guides/developer/dev-setup.md
    - Laste Opp Lib: guides/developer/laste-opp-lib.md
    - Secrets: guides/developer/secrets.md
    - Slack Alarmer: guides/developer/slack-alarmer.md
  - Roller:
    - Ansatt Datautforsker: guides/roller/ansatt-datautforsker.md
    - Dataanalytikere: guides/roller/dataanalytikere.md
    - Dataansvarlig: guides/roller/dataansvarlig.md
    - Dataplattform Admin: guides/roller/dataplattform-admin.md
    - Workspace Admin: guides/roller/workspace-admin.md
- Notion-sider:
  - notion/index.md
  - Referansearkitektur: notion/arkitektur-wip.md
  - Github Struktur Iac Dab Ci Cd: notion/github-struktur-iac-dab-ci-cd.md
  - Tilgangsstyring Og Roller: notion/tilgangsstyring-og-roller.md
plugins:
- search
- mermaid2
- excalidraw
- glightbox:
    auto_caption: false
    auto_themed: false
    background: white
    caption_position: bottom
    draggable: true
    effect: zoom
    height: auto
    loop: false
    manual: false
    shadow: true
    slide_effect: slide
    touchNavigation: true
    width: 100%
    zoomable: true
- gen-files:
    scripts:
    - docs/mkdocs_extension/generate_guides_index.py
    - docs/mkdocs_extension/generate_listof_bundles.py
    - docs/mkdocs_extension/generate_notion_nav.py
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_style: google
repo_url: https://github.com/oslokommune/padda-golden-path
site_description: Golden paths, Databricks bundles, and shared libs
site_name: Padda Golden Path
site_url: https://oslokommune.github.io/padda-golden-path/
theme:
  favicon: assets/favicon.ico
  features:
  - content.action.edit
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.tabs
  - navigation.tracking
  icon:
    admonition:
      example: material/ship-wheel
    edit: material/pencil
    repo: fontawesome/brands/github
  logo: assets/oslologo.svg
  name: material
  palette:
  - scheme: oslo
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
