bundle:
  name: SAT

include:
  - resources/*.yml


sync:
  include:
    - wheels/*.whl
    - configs/**
    - bin/trufflehog
    - dashboards/**

targets:
  dev:
    mode: production
    default: true
    presets:
      trigger_pause_status: UNPAUSED
    workspace:
      host: https://dbc-00000000-0003.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
