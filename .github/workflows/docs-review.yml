# Docs Review — Claude reviewer endringer i docs/ på PR-er.
# Fire sjekk-klasser: Diataxis, duplikat/konflikt, navigasjon, stil.
# Poster inline-kommentarer på konkrete linjer og én sticky summary-kommentar
# (markør <!-- diataxis-review -->) som oppdateres in-place hver run.

name: Docs Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "docs/**/*.md"

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    environment: claude-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            docs

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Docs review
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          track_progress: true
          claude_args: |
            --model eu.anthropic.claude-sonnet-4-6
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh api:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}
            BEFORE SHA: ${{ github.event.before }}
            AFTER SHA:  ${{ github.event.after }}

            Du skal gjennomgå dokumentasjonsendringene i denne PR-en. Reviewen
            dekker fire klasser av sjekker:

            1. Diataxis-compliance (tutorial / how-to / reference / explanation)
            2. Duplikat/konflikt med eksisterende docs
            3. Navigasjon (er filen lagt til i zensical.toml?)
            4. Stil-konsistens mot nabofiler

            Output:
            - Inline-kommentarer på spesifikke linjer for konkrete funn
            - ÉN sticky top-level summary-kommentar for overblikk

            ## Steg 1 — Finn eventuell tidligere summary-kommentar

            Kjør:

                gh api /repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
                  --jq '.[] | select(.body | contains("<!-- diataxis-review -->")) | .id'

            - Returnerer en ID → OPPDATER den kommentaren i steg 5
            - Returnerer tomt → OPPRETT ny kommentar i steg 5

            Hvis du oppdaterer en eksisterende kommentar: les først den gamle
            kommentar-body-en (`gh api /repos/.../issues/comments/<ID>`). Bruk
            den som utgangspunkt og merk fiksede punkter med gjennomstreking
            (`~~...~~ ✓ Rettet i <SHA>`) i stedet for å fjerne dem. Slik ser
            brukeren hva de har løst siden sist.

            ## Steg 2 — Bestem review-omfang

            Basert på EVENT:

            - **opened**: Første review. Hent full PR-diff og review alle endrede filer:

                  gh pr diff ${{ github.event.pull_request.number }}

            - **synchronize**: Delta-review. Hent KUN det som endret seg i siste push:

                  gh api /repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.event.after }}

              VIKTIG: Kommenter KUN på filer og linjer som er nye i dette deltaet.
              Eksisterende inline-kommentarer fra forrige run blir stående — poster
              du på samme linjer igjen, får brukeren duplikater.

            ## Steg 3 — Analyser endringene

            Reviewen dekker fire klasser av sjekker. Gjør alle for hver endret fil.

            ### 3a. Diataxis-compliance

            1. Les `.github/diataxis-references/diataxis-summary.md` for
               kompasset og oversikten
            2. Sjekk `diataxis`-feltet i frontmatter og les tilhørende referanse:
               - tutorial    → `.github/diataxis-references/tutorials.md`
               - how-to      → `.github/diataxis-references/how-to-guides.md`
               - reference   → `.github/diataxis-references/reference.md`
               - explanation → `.github/diataxis-references/explanation.md`

               Les kun referansefiler for typene som faktisk forekommer i PR-en.

            3. Vurder:
               - Er `diataxis`-frontmatter satt? Er typen korrekt for innholdet?
               - Følger innholdet prinsippene for sin deklarerte type?
               - Blandes typer uheldig? (F.eks. tutorial-steg i how-to,
                 forklaringer i reference, instruksjoner i explanation.)
               - Er frontmatter komplett (title, description, diataxis)?

            ### 3b. Duplikat- og konflikt-sjekk

            Bruk Grep/Glob i docs/ for å finne eksisterende innhold som
            kan overlappe med den nye/endrede filen:

            - Søk etter nøkkelord fra filens tittel og intro
            - Søk etter tekniske termer/konsepter filen dekker
            - Les eventuelle treff for å vurdere relevans

            Flagg hvis:
            - En annen fil allerede dekker samme tema (mulig duplikat —
              vurder om den eksisterende skulle utvides i stedet)
            - Innhold sier noe motstridende (konflikt — må løses)
            - Eksisterende fil burde vært oppdatert i stedet for at en ny ble lagt til

            ### 3c. Navigasjons-sjekk

            Les `zensical.toml` og sjekk at filens sti er inkludert under
            nav-seksjonen. Hvis ikke: flagg som "orphan-fil" — den vil ikke
            vises i menyen på docs-siten selv om Zensical bygger den.

            Unntak: index.md-filer i mapper med `navigation.indexes` kan være
            implisitt inkludert via section headers.

            ### 3d. Stil-konsistens

            Les 1-2 nabofiler i samme mappe for å forstå etablert stil.
            Sjekk om den nye filen avviker på:

            - Frontmatter-felter (title, description, diataxis — alle med?)
            - Header-hierarki (typisk H1 øverst, deretter H2 for seksjoner)
            - Admonitions (`!!!`), content tabs (`=== "..."`), kode-blokker
              med språkmarkering
            - Norsk tegnsetting — faktiske æøå, ikke ASCII-erstatninger
            - Tone og personform (passiv/aktiv, du/vi, imperativ/deklarativ)

            Mindre stilavvik er ok — flagg kun tydelige brudd på mønsteret
            i nabofilene.

            ## Steg 4 — Post inline-kommentarer

            For hvert konkret problem knyttet til en bestemt linje, bruk
            `mcp__github_inline_comment__create_inline_comment` med `confirmed: true`.

            Hver kommentar bør:
            - Peke på ETT problem
            - Være kort og konstruktiv
            - Henvise til Diataxis-prinsippet som brytes (kort)
            - Ved behov foreslå retning ("vurder å flytte til explanation-side")

            Hopp over inline hvis problemet gjelder HELE filen (f.eks. helt feil
            diataxis-type) — ta det i summary-kommentaren i stedet.

            ## Steg 5 — Bygg og post summary-kommentar

            Skriv kommentar-body til en midlertidig fil (f.eks. /tmp/review.md)
            for å unngå shell-escaping-trøbbel med markdown-tegn. Bruk dette formatet:

                <!-- diataxis-review -->
                ## Docs review

                **Oppsummering:** [En-to setninger om overall inntrykk.]

                ### docs/hjelp/lorem.md — how-to
                [En-to setninger om filen, inkludert:
                - Diataxis-vurdering
                - Eventuell duplikat/konflikt med eksisterende docs
                - Om filen er lagt til i navigasjonen
                - Tydelige stilavvik
                Henvis til inline-kommentarer for linje-spesifikke funn.]

                ### docs/referanse/noe.md — reference
                [...]

                ---
                <sub>Sist oppdatert etter commit ${{ github.event.after }}</sub>

            Ved oppdatering: behold tidligere funn, men merk fiksede med
            `~~tekst~~ ✓ Rettet i <SHA>`. Nye funn legges til uten gjennomstreking.

            Hvis INGEN problemer funnet: skriv "Ingen problemer funnet i endringene."
            (behold markør og footer).

            Hvis du fant en eksisterende kommentar-ID i steg 1:

                gh api --method PATCH \
                  /repos/${{ github.repository }}/issues/comments/<ID> \
                  -f body="$(cat /tmp/review.md)"

            Ellers opprett ny:

                gh pr comment ${{ github.event.pull_request.number }} \
                  --body-file /tmp/review.md

            ## Retningslinjer

            - Inline-kommentarer: ett konkret problem per kommentar, knyttet til
              riktig linje. Kort og konstruktiv.
            - Summary-kommentar: per-fil-seksjon med kort prosa som dekker alle
              fire sjekk-klassene (Diataxis, duplikat/konflikt, navigasjon, stil).
              Inline bærer detaljene — summary gir overblikket.
            - Ved delta-review: kommenter KUN på endringene i deltaet — unngå
              duplikater på linjer som ikke er endret siden forrige push.
            - Ved oppdatering av summary: gjennomstreking på fiksede funn,
              ikke sletting. Brukeren skal se progresjonen.
            - Henvis til Diataxis-referansene for type-problemer, og til
              nabofiler/eksisterende docs for stil- og duplikatvurderinger.
            - Ikke nit-pick — fokus på tydelige strukturelle problemer og
              tydelige avvik fra etablert mønster.
            - Skriv på norsk.
