[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "golden-path"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
    "pyspark>=4.0.1",
    "requests>=2.33.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[project.optional-dependencies]
docs = [
  "zensical>=0.0.34",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pre-commit",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
# bundle-templates contains templated (non-runnable) test files, and
# examples/vscode-demo is a standalone uv project with its own environment.
addopts = "--ignore=bundle-templates --ignore=examples/vscode-demo"
