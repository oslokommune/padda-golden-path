variables:
  catalog:
    default: origo_felles_dev_green # Change to your desired catalog
  schema:
    default: api_ingest # Change to your desired schema
  api_base_url:
    default: "https://test.io.web.oslo.kommune.no"
  api_endpoint:
    default: "/v3/salaries/current"
  alert_notification_id:
    default: "00000000-0000-0000-0000-000000000006"  # Change to your desired notification ID
  job_cluster_node_type:
    default: "m5.large"  # Cheapest supported general-purpose node type; override if needed

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel
    
resources:
  jobs:
    api_ingest_job:
      name: "API Ingest Job"
      timeout_seconds: 3000  # Fail the run if it exceeds 50 minutes
      max_concurrent_runs: 1
      # Slack/webhook notifications temporarily disabled; uncomment when alerting is configured.
      # webhook_notifications:
      #   on_failure:
      #     - id: ${var.alert_notification_id}
      # notification_settings:
      #   no_alert_for_skipped_runs: false
      #   no_alert_for_canceled_runs: false
      job_clusters:
        - job_cluster_key: single_node_job_cluster
          new_cluster:
            spark_version: "17.3.x-scala2.13" # databricks clusters spark-versions --profile <profile>
            node_type_id: ${var.job_cluster_node_type}
            num_workers: 0
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*]
            custom_tags:
              ResourceClass: SingleNode
            autotermination_minutes: 15
            enable_elastic_disk: true
            runtime_engine: STANDARD
      tasks:
        - task_key: setup
          timeout_seconds: 1200
          max_retries: 1
          retry_on_timeout: true
          job_cluster_key: single_node_job_cluster
          libraries:
          - whl: dist/*.whl
          python_wheel_task:
            package_name: api_ingest
            entry_point: setup
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
        - task_key: api_ingest
          depends_on:
            - task_key: setup
          timeout_seconds: 1800
          max_retries: 2
          retry_on_timeout: true
          job_cluster_key: single_node_job_cluster
          python_wheel_task:
            package_name: api_ingest
            entry_point: ingest
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${var.schema}
              - "--api-base-url"
              - ${var.api_base_url}
              - "--api-endpoint"
              - ${var.api_endpoint}
              
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host:  https://dbc-00000000-0002.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host:  https://dbc-00000000-0002.cloud.databricks.com
      root_path: /Workspace/Users/CHANGEME/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: CHANGEME
        level: CAN_MANAGE
