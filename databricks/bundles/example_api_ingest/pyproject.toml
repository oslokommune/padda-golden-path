[project]
name = "example_api_ingest"
version = "0.1.0"
authors = [{ name = "fredrik.lovejord@origo.oslo.kommune.no" }]
requires-python = ">= 3.11"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = [
    "tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_ingest"]
