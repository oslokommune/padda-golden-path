name: CI
on:
  pull_request:
    branches: ["main"]
jobs:
  check_python_code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format
        run: uv format --check
      - name: Lint
        run: uvx ruff check
