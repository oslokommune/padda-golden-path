resources:
  jobs:
    sat_driver:
      name: "SAT Driver Notebook"
      tags:
        Application: SAT

      schedule:
        quartz_cron_expression: "0 0 7 ? * Mon,Wed,Fri"
        timezone_id: "Europe/Oslo"

      environments:
        - environment_key: "Default"
          spec:
            environment_version: "2"

      tasks:
        - task_key: "sat_driver"
          environment_key: "Default"
          notebook_task:
            notebook_path: ../notebooks/security_analysis_driver.py
