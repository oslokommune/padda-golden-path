# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
custom_dir = "docs/overrides"
language = "nb"
logo = "assets/oslologo.svg"
favicon = "assets/favicon.ico"
features = [
  "header.autohide",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.indexes",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.tracking",
  "search.highlight",
]

# Disable Google Fonts entirely — we load Oslo Sans via custom CSS
# and set the code font via CSS as well.
font = false

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/file-pen"
admonition = { example = "lucide/ship", tip = "lucide/lightbulb" }

# Single light scheme — Oslo kommune does not use dark mode
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"

# ---------------------------------------------------------------------------
# Social links (footer)
# ---------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/oslokommune"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/company/digitaliseringsetaten"

# ---------------------------------------------------------------------------
# Markdown extensions
#
# Omitting markdown_extensions entirely gives us the rich Zensical defaults
# which include admonition, pymdownx.superfences (with Mermaid), pymdownx.keys,
# attr_list, pymdownx.highlight, content tabs, task lists, and more.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
[project.plugins]
search = { enabled = true }
