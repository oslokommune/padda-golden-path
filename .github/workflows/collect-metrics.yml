name: Collect Databricks Metrics

# Weekly workspace inventory snapshot — counts jobs, DLT pipelines, and tables
# per medallion layer across the workspaces in one Databricks account, uploaded
# as JSONL to that environment's Unity Catalog landing volume. The
# platform_metrics DLT pipeline (in padda-databrikker) reads it via Auto Loader.
#
# Runs once per GitHub environment (dev, prod) via the matrix below. Each
# environment supplies its own config as environment variables; only the
# catalog varies the upload path.
#   vars: DATABRICKS_ACCOUNT_ID, DATABRICKS_CLIENT_ID, DATABRICKS_HOST,
#         DATABRICKS_METRICS_CATALOG
#
# Auth: GitHub OIDC federation (RFC 8693 token-exchange) — the job mints an OIDC
# token with the Databricks account as audience; client_id selects the collector
# SP, whose federation policy in padda-iac authorizes it. No stored secret.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    environment:
      name: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install urllib3

      - name: Mint Databricks OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ vars.DATABRICKS_ACCOUNT_ID }}" \
            | jq -r '.value')
          echo "OIDC token claims (iss/aud/sub):"
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ('iss','aud','sub')}, indent=2))"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Collect metrics
        env:
          DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_METRICS_CATALOG: ${{ vars.DATABRICKS_METRICS_CATALOG }}
          ACCOUNT_LABEL: ${{ matrix.environment }}
        run: python .github/scripts/collect_platform_metrics.py
