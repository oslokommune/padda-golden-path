name: Collect DORA Events

# Captures this repo's merged PRs, computes per-PR lead time, and uploads JSONL
# to each environment's Unity Catalog landing volume. The platform_metrics DLT
# pipeline (in padda-databrikker) reads it via Auto Loader.
#
# Single-repo by design — this file and .github/scripts/collect_dora_events.py
# are copied verbatim to padda-golden-path, padda-iac, and padda-databrikker so
# each repo emits its own events. Keep the three copies in sync.
#
# Runs once per GitHub environment (dev, prod) via the matrix. Each environment
# supplies its own config; only the catalog varies the upload path.
#   vars:    DATABRICKS_ACCOUNT_ID, DATABRICKS_CLIENT_ID, DATABRICKS_HOST,
#            DATABRICKS_METRICS_CATALOG
#   secrets: DATABRICKS_CLIENT_SECRET
#
# Auth: Databricks M2M client_credentials.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback window in days (default 7)."
        required: false
        default: "7"

permissions:
  contents: read
  pull-requests: read

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    environment:
      name: ${{ matrix.environment }}
    concurrency:
      group: collect-dora-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install urllib3

      - name: Collect DORA events
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_METRICS_CATALOG: ${{ vars.DATABRICKS_METRICS_CATALOG }}
        run: python .github/scripts/collect_dora_events.py
