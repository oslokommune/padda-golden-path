[project]
site_name = "Databricks-plattformen <i>Padda</i>"
site_description = "Brolagt sti, Databricks-bundler og delte bibliotek"
site_author = "Digitaliseringsetaten"
copyright = "Laget med &hearts; av Digitaliseringsetaten"
repo_url = "https://github.com/oslokommune/padda-golden-path"
repo_name = "oslokommune/padda-golden-path"
edit_uri = "tree/main/docs"
docs_dir = "docs"
site_dir = "site"

extra_css = [
  "zensical-stylesheets/punkt-tokens.css",
  "zensical-stylesheets/oslo-theme.css",
]

