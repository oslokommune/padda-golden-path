name: Collect DORA Events

# Captures this repo's merged PRs, computes per-PR lead time, and uploads JSONL
# to each environment's Unity Catalog landing volume. The platform_metrics DLT
# pipeline (in padda-databrikker) reads it via Auto Loader.
#
# Single-repo by design — this file and .github/scripts/collect_dora_events.py
# are copied verbatim to padda-golden-path, padda-iac, padda-databrikker, and
# terraform-databricks-sra so each repo emits its own events. Keep the four
# copies in sync.
#
# Runs once per GitHub environment (dev, prod) via the matrix. Each environment
# supplies its own config as environment variables; only the catalog varies the
# upload path.
#   vars: DATABRICKS_ACCOUNT_ID, DATABRICKS_CLIENT_ID, DATABRICKS_HOST,
#         DATABRICKS_METRICS_CATALOG
#
# Auth: GitHub OIDC federation (RFC 8693 token-exchange) — the job mints an OIDC
# token with the Databricks account as audience; client_id selects the collector
# SP, whose federation policy in padda-iac authorizes it. No stored secret.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Lookback window in days (default 7)."
        required: false
        default: "7"

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    environment:
      name: ${{ matrix.environment }}
    concurrency:
      group: collect-dora-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install urllib3

      - name: Mint Databricks OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ vars.DATABRICKS_ACCOUNT_ID }}" \
            | jq -r '.value')
          echo "OIDC token claims (iss/aud/sub):"
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ('iss','aud','sub')}, indent=2))"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Collect DORA events
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABRICKS_ACCOUNT_ID: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_METRICS_CATALOG: ${{ vars.DATABRICKS_METRICS_CATALOG }}
        run: python .github/scripts/collect_dora_events.py
