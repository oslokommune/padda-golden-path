site_name: Padda Golden Path
site_description: Golden paths, Databricks bundles, and shared libs
site_url: https://oslokommune.github.io/padda-golden-path/
repo_name: oslokommune/padda-golden-path
repo_url: https://github.com/oslokommune/padda-golden-path
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
nav:
  - Home: index.md
  - Golden Paths:
      - Databricks Bundles: golden-paths/databricks-bundles.md
      - Generic Pipelines: golden-paths/generic-pipelines.md
  - Guides:
      - Developer setup: guides/dev-setup.md
      - uv Workspace: guides/uv-workspace-howto.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

