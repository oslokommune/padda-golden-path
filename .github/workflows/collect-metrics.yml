name: Collect Databricks Metrics

# Weekly workspace inventory snapshot — counts jobs, DLT pipelines, and
# tables per medallion layer across all workspaces in the dev and prod
# Databricks accounts. Uploads JSONL to a Unity Catalog volume; the
# platform_metrics DLT pipeline (in padda-databrikker) reads from there
# via Auto Loader.
#
# Auth: GitHub → Databricks OIDC federation only — no AWS, no S3.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DEV_DATABRICKS_ACCOUNT_ID: "69d82905-dc92-4349-89b2-c4bf6501cb82"
  PROD_DATABRICKS_ACCOUNT_ID: "5a3d7d58-a44f-4baa-b0df-5648148988d5"
  DATABRICKS_HOST: "https://dbc-d17b7ed1-eac0.cloud.databricks.com"
  VOLUME_PATH: "/Volumes/padda_dev_green/landing_default/platform_events/metrics"

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install urllib3

      - name: Get Databricks OIDC token (dev account)
        id: dbx-dev
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$DEV_DATABRICKS_ACCOUNT_ID" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Get Databricks OIDC token (prod account)
        id: dbx-prod
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PROD_DATABRICKS_ACCOUNT_ID" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Collect metrics
        env:
          DEV_OIDC_TOKEN: ${{ steps.dbx-dev.outputs.token }}
          PROD_OIDC_TOKEN: ${{ steps.dbx-prod.outputs.token }}
        run: python .github/scripts/collect_platform_metrics.py
