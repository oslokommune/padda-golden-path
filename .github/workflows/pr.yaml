name: CI
on:
  pull_request:
    branches: ["main"]
jobs:
  format_and_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Format
        run: uv format --check
      - name: Lint
        run: uvx ruff check
  validate_bundle:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_CLIENT_ID: "5503fd85-196d-4df6-92f6-2809834231de"
      DATABRICKS_AUTH_TYPE: "github-oidc"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: databricks/setup-cli@8f31045b51b51b0ffe719d36a4aaf9c556691b3b
      - name: Validate bundle
        run: databricks bundle validate
      - name: Plan bundle
        run: databricks bundle plan
