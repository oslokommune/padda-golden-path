name: CI
on:
  pull_request:
    branches: ["main"]
jobs:
  generate_python_dir_matrix:
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.list-dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: list-dirs
        run: |
          # Generate a JSON array of directory names (e.g., '["dir1", "dir2"]')
          DIRS=$(find ./libs -mindepth 1 -maxdepth 1 | jq -R . | jq -s . | jq -c .)
          echo "dirs=$DIRS" >> $GITHUB_OUTPUT
  validate_python_libs:
    needs: generate_python_dir_matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.generate_python_dir_matrix.outputs.directories) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format ${{matrix.directory}}
        run: uv format --check
        working-directory: ${{ matrix.directory }}
      - name: Lint ${{matrix.directory}}
        run: uvx ruff check .
        working-directory: ${{ matrix.directory }}
