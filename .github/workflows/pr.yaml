name: CI
on:
  pull_request:
    branches: ["main"]
permissions:
  id-token: write
  contents: read
jobs:
  check_bundle:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_CLIENT_ID: "5503fd85-196d-4df6-92f6-2809834231de"
      DATABRICKS_AUTH_TYPE: "github-oidc"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Format
        run: uv format --check
      - name: Lint
        run: uvx ruff check
      - uses: databricks/setup-cli@8f31045b51b51b0ffe719d36a4aaf9c556691b3b
      - name: Validate bundle
        run: databricks bundle validate
      - name: Plan bundle
        run: databricks bundle plan
  deploy_lambda:
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: "arn:aws:iam::316489803684:role/padda_workspace_deploy"
          role-session-name: samplerolesession
          aws-region: "eu-west-1"
      - name: Upload lambda function code
        run: |
          zip /tmp/padda_test_pull_lambda.zip lambdas/padda_test_pull_lambda/pull.py
          aws lambda update-function-code --function-name padda_test_pull_lambda --zip-file fileb:///tmp/padda_test_pull_lambda.zip
